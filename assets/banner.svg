<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Adithya A, AI and ML engineer building real-time systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0b2236"/>
      <stop offset="1" stop-color="#0e4a5e"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#22d3ee" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .line { opacity: 0; animation: cycle 12s infinite; }
    .l2 { animation-delay: 3s; }
    .l3 { animation-delay: 6s; }
    .l4 { animation-delay: 9s; }
    @keyframes cycle {
      0%   { opacity: 0; transform: translateY(8px); }
      4%   { opacity: 1; transform: translateY(0); }
      21%  { opacity: 1; transform: translateY(0); }
      25%  { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; }
    }
    .cursor { animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    .pulse { animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    .node { animation: node 4s ease-in-out infinite; }
    .n2 { animation-delay: 0.8s; }
    .n3 { animation-delay: 1.6s; }
    .n4 { animation-delay: 2.4s; }
    @keyframes node { 0%,100% { stroke-opacity: 0.45; } 50% { stroke-opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .line, .cursor, .pulse, .node { animation: none; }
      .l1 { opacity: 1; }
      .dot { display: none; }
    }
  </style>

  <rect width="1000" height="260" fill="url(#bg)"/>
  <rect width="1000" height="260" fill="url(#grid)"/>
  <circle class="pulse" cx="160" cy="130" r="210" fill="url(#glow)"/>

  <!-- corner brackets -->
  <path d="M18 46V18H46 M954 18H982V46 M982 214V242H954 M46 242H18V214" fill="none" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="2"/>

  <!-- name -->
  <text x="48" y="104" class="mono" font-size="60" font-weight="800" fill="url(#ink)">ADITHYA A</text>
  <text x="50" y="138" class="sans" font-size="15" letter-spacing="5" fill="#9fb3c8">AI &amp; ML ENGINEER</text>

  <!-- rotating tagline -->
  <g class="mono" font-size="18" fill="#e6edf3">
    <g class="line l1"><text x="50" y="190"><tspan fill="#22d3ee">&gt; </tspan>Building real-time ML systems</text></g>
    <g class="line l2"><text x="50" y="190"><tspan fill="#22d3ee">&gt; </tspan>Real-time intrusion detection</text></g>
    <g class="line l3"><text x="50" y="190"><tspan fill="#22d3ee">&gt; </tspan>Deterministic, replayable agents</text></g>
    <g class="line l4"><text x="50" y="190"><tspan fill="#22d3ee">&gt; </tspan>RAG + vision for wildfire response</text></g>
  </g>
  <rect class="cursor" x="50" y="203" width="10" height="3" fill="#22d3ee"/>

  <!-- pipeline graphic -->
  <g>
    <path d="M640 120H940" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 6"/>
    <g class="mono" font-size="13" text-anchor="middle" fill="#e6edf3">
      <rect class="node n1" x="600" y="98" width="80" height="44" rx="9" fill="#0d1117" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="640" y="125">Kafka</text>
      <rect class="node n2" x="700" y="98" width="80" height="44" rx="9" fill="#0d1117" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="740" y="125">Spark</text>
      <rect class="node n3" x="800" y="98" width="80" height="44" rx="9" fill="#0d1117" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="840" y="125">Model</text>
      <rect class="node n4" x="900" y="98" width="80" height="44" rx="9" fill="#0d1117" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="940" y="125">Live UI</text>
    </g>
    <circle class="dot" r="4" fill="#22d3ee"><animateMotion dur="3.2s" repeatCount="indefinite" path="M640 120H940"/></circle>
    <circle class="dot" r="4" fill="#67e8f9"><animateMotion dur="3.2s" begin="1.07s" repeatCount="indefinite" path="M640 120H940"/></circle>
    <circle class="dot" r="4" fill="#a5f3fc"><animateMotion dur="3.2s" begin="2.13s" repeatCount="indefinite" path="M640 120H940"/></circle>
    <text x="790" y="178" class="mono" font-size="12" text-anchor="middle" fill="#9fb3c8">deterministic Â· replayable Â· measured</text>
  </g>
</svg>

