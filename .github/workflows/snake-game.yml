name: Snake game

# Every click on a direction link in the README opens an issue titled
# "snake|<command>". This workflow applies the move, redraws the board,
# commits it, and closes the issue. The issue title and author are untrusted
# input: they are only ever passed to the script as environment variables.

on:
  issues:
    types: [opened]

concurrency:
  group: snake-game
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  play:
    if: startsWith(github.event.issue.title, 'snake|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply move
        env:
          TITLE: ${{ github.event.issue.title }}
          ACTOR: ${{ github.event.issue.user.login }}
          MESSAGE_FILE: ${{ runner.temp }}/message.txt
        run: python3 game/snake_game.py

      - name: Commit board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/state.json assets/snake-game.svg
          if git diff --cached --quiet; then
            echo "Board unchanged"
            exit 0
          fi
          git commit -m "game: snake move"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Reply and close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MESSAGE_FILE: ${{ runner.temp }}/message.txt
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$MESSAGE_FILE"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
